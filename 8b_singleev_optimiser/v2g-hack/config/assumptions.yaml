# Global assumptions (S0). Values marked ASSUMPTION are placeholders to be replaced.
region: GB
currency: GBP
timezone_local: Europe/London   # habits (plug-in times) are learned in local time; data is UTC internally
dt_h: 0.5                       # must match the price settlement period

battery:
  e_cap_kwh: 60                 # ASSUMPTION typical mid-size pack
  soc_min: 0.20                 # V2G floor: the optimiser never discharges below this
  soc_max: 0.90                 # charge limit
  soc_initial: 0.60
  soc_departure_default: 0.60   # driver's "ready by" SoC unless the session says otherwise
  eta_batt_rt: 0.95             # battery round-trip efficiency (split evenly charge/discharge)
  # linear degradation (8.C step 1): c_deg = battery_cost / (cycle_life * 2 * E_cap * DoD)
  battery_cost_per_kwh: 100     # ASSUMPTION currency/kWh of pack
  cycle_life: 3000              # ASSUMPTION full equivalent cycles
  dod: 0.8

tariff:
  # buy  = wholesale + import_adder ; sell = wholesale + export_adder   (currency/MWh)
  # This is the "double fee" / policy toggle (D-l). PLACEHOLDER values.
  import_adder_per_mwh: 15
  export_adder_per_mwh: -5

optimiser:
  eval_days: 28                 # evaluation window (most recent days of data)
  history_days: 14              # days before the window used for learning habits + naive forecast
  eta_load_fraction: 1.0        # operating point at which the spec efficiency curve is read
  horizon_steps: 48             # MPC look-ahead (48 x 30 min = 24 h)
  reopt_every_steps: 1          # MPC re-solve cadence (also re-solves on every arrival)
  rule_discharge_slots: 4       # rule-based timer: discharge in the k most expensive slots per session
  price_source: forecast        # forecast (S3 P50, else seasonal naive) | perfect
  # App setting (§8.B.1): which version of the driver's-needs constraint the optimiser uses.
  #   max_savings       : hold the next (learned) trip + reserve at each departure; soft floor
  #   guaranteed_charge : also SoC >= target_soc whenever plugged in; sells only above target
  mode: max_savings             # max_savings | guaranteed_charge
  target_soc: 0.80              # guaranteed_charge only: the driver's chosen minimum (fraction)

forecast_backtest:
  # Rolling decision-value backtest on Tony's price forecasts (S3 -> S5). See docs/forecast_backtest.md.
  # Paths are relative to the repository root.
  forecast_path: artefacts/forecasts/handoff_price_forecasts.parquet
  forecast_fallback_path: artefacts/forecasts/price_quantiles.parquet
  prices_path: data/processed/prices.parquet
  converter_spec_path: config/converter_spec.yaml      # the root contract file (identical values to ours)
  series: elexon_mid
  models: [lear_x, lear, naive_daily, naive_weekly]    # plus perfect_foresight, run through the same loop
  window: {start: "2025-10-01", end: "2026-09-30"}     # local issue dates, inclusive
  smoke_window: {start: "2025-11-03", end: "2025-11-30"}
  profile:                                             # no real 2025-26 sessions exist: a documented weekday commuter
    kind: commuter
    weekday_depart_h: 7.75
    weekday_return_h: 18.0
    weekday_trip_kwh: 9.0
    saturday_depart_h: 11.0
    saturday_return_h: 16.0
    saturday_trip_kwh: 12.0
    sunday_trip_kwh: 0
  floor_reserve: 0.10                                  # Option B (learned habits) with the true trips, for every price model
  out_dir: artefacts/schedules
  figures_dir: artefacts/figures
