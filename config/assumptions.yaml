region: gb
currency: gbp
currency_symbol: "£"
settlement_period_minutes: 30
dt_h: 0.5
years: [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036]
scenarios:
  base:
    ev_stock_2026: 2000000
    ev_stock_2036: 36000000
  low:
    ev_stock_2026: 1500000
    ev_stock_2036: 25000000
  high:
    ev_stock_2026: 3000000
    ev_stock_2036: 45000000
battery:
  capacity_kwh: 60.0
  soc_min: 0.2
  soc_max: 0.9
  max_cycles: 3000
  degradation_cost_per_kwh: 0.08
participation:
  base: 0.2
  low: 0.1
  high: 0.4
price_policy:
  import_fee_multiplier: 1.0
  export_fee_multiplier: 0.9
  double_fee_policy: false
forecast:
  series: elexon_mid
  issue_local_time: "10:00"
  timezone: Europe/London
  # A price period is known at issue time only if its START <= issue_time - lag * 30 min
  # (so periods starting up to 09:00 for a 10:00 issue).
  price_known_lag_periods: 2
  # Local issue dates, inclusive.
  smoke_window: {start: 2025-11-03, end: 2025-11-30}
  backtest_window: {start: 2025-10-01, end: 2026-09-30}
  # Empirical residual quantiles use this many days of the model's own past errors.
  quantile_history_days: 56
  # Lead-time bucket edges in hours, left-closed: [0,6) [6,12) [12,24) [24,40).
  lead_buckets_h: [0, 6, 12, 24, 40]
  lear:
    calibration_windows_days: [56, 84, 364, 728]
    recalibrate_every_days: 1          # >1 reuses the last fit on the days in between (faster smoke runs)
    impute_max_gap_periods: 8          # linear interpolation of short gaps, for features and training targets only
    lambda_selection: aic              # aic | bic | cv
    n_jobs: -1
    write_component_models: false      # also write lear_w56, lear_w84, ... for diagnostics
    # Criterion per model, frozen after validation on validation_window (see src/v2g/forecast/README.md).
    lambda_selection_by_model: {}
  exog:
    enabled_for_models: [lear_x]
    # Exogenous forecast vintages used as features (see data/processed/exog/). wind_neso_da_mw is
    # ingested but excluded: its vintage stamps are unreliable from late 2025.
    variables: [wind_da_mw, embedded_wind_mw, embedded_solar_mw, demand_da_mw]
    exog_known_lag_minutes: 0         # a vintage is usable if forecast_made_utc <= issue - this lag
    include_residual_load: true       # derived: demand - wind - embedded wind - embedded solar, per slot
    sources: [elexon_ndf, elexon_windfor, neso_embedded_forecast]
  # Criterion selection happens here, never on the backtest window.
  validation_window: {start: 2025-04-01, end: 2025-09-30}

ingest:
  exog:
    # Exogenous forecast vintages (stage S2): one processed parquet per source in data/processed/exog/.
    start: 2023-01-01              # first publish/target date, inclusive
    end: 2026-10-02                # exclusive; covers 728-day windows, warm-up, validation and the backtest
    timezone: Europe/London        # settlement-period clock
    max_lead_hours: 48             # keep vintages up to 48 h ahead of their target (the embedded archive has 13-day horizons)
    capacity_tolerance: 1.1        # value_mw <= capacity_mw * 1.1 where a capacity is reported
    plausible_mw:                  # [min, max] sanity bounds per variable
      wind_da_mw: [0, 40000]
      wind_neso_da_mw: [0, 40000]
      embedded_wind_mw: [0, 20000]
      embedded_solar_mw: [0, 40000]
      demand_da_mw: [10000, 65000]
    sleep_s: 0.2                   # pause between API calls
