# S0 global assumptions for the ExtraEnergy app (CONTEXT.md §6, §8.I).
# The app reads this file; its built-in defaults are only a fallback if the file is missing.
# Values marked ASSUMPTION are placeholders to be replaced. Validated by shared/schema.py.
region: GB
currency: GBP
dt_h: 0.5                         # 30-min settlement periods; must divide a day

battery:
  e_cap_kwh: 60.0                 # ASSUMPTION typical mid-size pack
  reserve_kwh: 6.0                # ASSUMPTION safety reserve on top of the next trip (max savings)
  soc_min: 0.20                   # V2G floor: never discharge below this
  soc_max: 0.90                   # charge limit
  c_deg_per_mwh: 20.0             # ASSUMPTION battery wear per MWh of throughput (= 0.02 £/kWh), §8.C step 1

owner:
  plug_days_per_year: 300         # ASSUMPTION nights a year the car is plugged in overnight

tariff:
  export_price_fraction: 0.85     # ASSUMPTION export price = 85 % of the import price

optimiser:
  mode: guaranteed_charge         # app default: max_savings | guaranteed_charge (§8.B.1)
  target_soc: 0.60                # guaranteed_charge: the owner's minimum (fraction)
