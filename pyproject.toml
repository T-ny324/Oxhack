[project]
name = "oxhack-v2g"
version = "0.1.0"
description = "ExtraEnergy V2G: full pipeline dependencies (the cloud app only uses requirements.txt)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "streamlit>=1.66",
  "plotly",
  "cvxpy>=1.0",
  "scipy>=1.11",
  "lightgbm>=4.0",
  "salib>=1.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]       # so tests import `shared` and `v2g` without installing
testpaths = ["tests"]