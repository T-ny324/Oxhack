[project]
name = "oxhack-v2g"
version = "0.1.0"
description = "ExtraEnergy V2G: full pipeline dependencies (the cloud app only uses requirements.txt)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyarrow>=14.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "streamlit>=1.66",
  "plotly",
  "cvxpy>=1.0",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "lightgbm>=4.0",
  "salib>=1.8",
  "paho-mqtt>=2.0",      # src/v2g/control: schedule -> charger over MQTT (hardware/firmware_c)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.4",
  "matplotlib>=3.8",
  "jupyter-core>=5.0",
  "nbconvert>=7.0",
  "nbformat>=5.0",
  "nbclient>=0.9",
  "ipykernel>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]       # so tests import `shared` and `v2g` without installing
