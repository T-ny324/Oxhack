[project]
name = "oxhack-v2g"
version = "0.1.0"
description = "V2G hackathon pipeline and demo scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "pyarrow>=14.0",
  "requests>=2.31",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "streamlit>=1.30",
  "cvxpy>=1.0",
  "scipy>=1.11",
  "lightgbm>=4.0",
  "salib>=1.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "black>=24.0",
  "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
